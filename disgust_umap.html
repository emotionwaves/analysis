 America)\u003c\u002fspan\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePreceding event:\u003c\u002fb\u003e\u003cbr\u003euncleannes of house\u003cbr\u003e\u003cbr\u003e\u003cb\u003eSubsequent event:\u003c\u002fb\u003e\u003cbr\u003ekeeping away from the house","\u003cb\u003etrickster's failed predation\u003c\u002fb\u003e\u003cbr\u003e\u003ci\u003eAnimals\u003c\u002fi\u003e (soft, conf=0.17)\u003cbr\u003e\u003cspan style='color:#aaa'\u003eHopi (North America)\u003c\u002fspan\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePreceding event:\u003c\u002fb\u003e\u003cbr\u003ea coyote trying to get revenge\u003cbr\u003e\u003cbr\u003e\u003cb\u003eSubsequent event:\u003c\u002fb\u003e\u003cbr\u003eCoyote leaves the turtles after being thwarted","\u003cb\u003etoads\u003c\u002fb\u003e\u003cbr\u003e\u003ci\u003eAnimals\u003c\u002fi\u003e (high_confidence, conf=0.49)\u003cbr\u003e\u003cspan style='color:#aaa'\u003eKogi (South America)\u003c\u002fspan\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePreceding event:\u003c\u002fb\u003e\u003cbr\u003etoads associated with female sexuality\u003cbr\u003e\u003cbr\u003e\u003cb\u003eSubsequent event:\u003c\u002fb\u003e\u003cbr\u003ebeing disgusted by toads","\u003cb\u003edog transformation\u003c\u002fb\u003e\u003cbr\u003e\u003ci\u003eAnimals\u003c\u002fi\u003e (soft, conf=0.15)\u003cbr\u003e\u003cspan style='color:#aaa'\u003eBlackfoot (North America)\u003c\u002fspan\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePreceding event:\u003c\u002fb\u003e\u003cbr\u003egirl expresses a wish that her dog could be a young man.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eSubsequent event:\u003c\u002fb\u003e\u003cbr\u003ethe girl is humiliated upon learning the dog has transformed into a man","\u003cb\u003emonstrous outgroup appearance\u003c\u002fb\u003e\u003cbr\u003e\u003ci\u003eAnimals\u003c\u002fi\u003e (soft, conf=0.13)\u003cbr\u003e\u003cspan style='color:#aaa'\u003eYakut (Asia)\u003c\u002fspan\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePreceding event:\u003c\u002fb\u003e\u003cbr\u003ephysical features of russians, particularly characteristics such as long noses,\u003cbr\u003ebeards, and sunken eyes, which were initially perceived as monstrous or\u003cbr\u003erepugnant.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eSubsequent event:\u003c\u002fb\u003e\u003cbr\u003echange in perception","\u003cb\u003ealbinos\u003c\u002fb\u003e\u003cbr\u003e\u003ci\u003eAnimals\u003c\u002fi\u003e (soft, conf=0.20)\u003cbr\u003e\u003cspan style='color:#aaa'\u003eTrobriands (Oceania)\u003c\u002fspan\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePreceding event:\u003c\u002fb\u003e\u003cbr\u003ealbino people in society\u003cbr\u003e\u003cbr\u003e\u003cb\u003eSubsequent event:\u003c\u002fb\u003e\u003cbr\u003e(albino women still bring forth numerous progeny — the natives explain this via\u003cbr\u003ebaloma spirits)","\u003cb\u003evices\u003c\u002fb\u003e\u003cbr\u003e\u003ci\u003eAnimals\u003c\u002fi\u003e (soft, conf=0.12)\u003cbr\u003e\u003cspan style='color:#aaa'\u003eWolof (Africa)\u003c\u002fspan\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePreceding event:\u003c\u002fb\u003e\u003cbr\u003ea man marries into a tribe but has many vices\u003cbr\u003e\u003cbr\u003e\u003cb\u003eSubsequent event:\u003c\u002fb\u003e\u003cbr\u003ethe people abandon him","\u003cb\u003einfestation\u003c\u002fb\u003e\u003cbr\u003e\u003ci\u003eAnimals\u003c\u002fi\u003e (high_confidence, conf=0.26)\u003cbr\u003e\u003cspan style='color:#aaa'\u003eAkan (Africa)\u003c\u002fspan\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePreceding event:\u003c\u002fb\u003e\u003cbr\u003epatient claiming her body is afflicted by a concrete infestation\u003cbr\u003e\u003cbr\u003e\u003cb\u003eSubsequent event:\u003c\u002fb\u003e\u003cbr\u003eas the illness worsens, she fears she will harm others through her concrete\u003cbr\u003eagents","\u003cb\u003erats\u003c\u002fb\u003e\u003cbr\u003e\u003ci\u003eAnimals\u003c\u002fi\u003e (high_confidence, conf=0.53)\u003cbr\u003e\u003cspan style='color:#aaa'\u003eOna (South America)\u003c\u002fspan\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePreceding event:\u003c\u002fb\u003e\u003cbr\u003eencountering a live rat\u003cbr\u003e\u003cbr\u003e\u003cb\u003eSubsequent event:\u003c\u002fb\u003e\u003cbr\u003e(belief recorded that Ona feel severe itching from touching a live rat)","\u003cb\u003eearthworms\u003c\u002fb\u003e\u003cbr\u003e\u003ci\u003eAnimals\u003c\u002fi\u003e (high_confidence, conf=0.46)\u003cbr\u003e\u003cspan style='color:#aaa'\u003eChuuk (Oceania)\u003c\u002fspan\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePreceding event:\u003c\u002fb\u003e\u003cbr\u003econsidering using earthworms as fishing bait\u003cbr\u003e\u003cbr\u003e\u003cb\u003eSubsequent event:\u003c\u002fb\u003e\u003cbr\u003ethey do not use earthworms as bait","\u003cb\u003edogs\u003c\u002fb\u003e\u003cbr\u003e\u003ci\u003eAnimals\u003c\u002fi\u003e (high_confidence, conf=0.41)\u003cbr\u003e\u003cspan style='color:#aaa'\u003eMaasai (Africa)\u003c\u002fspan\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePreceding event:\u003c\u002fb\u003e\u003cbr\u003ebiblical references treating dogs as unclean (eating torn flesh, etc.)\u003cbr\u003e\u003cbr\u003e\u003cb\u003eSubsequent event:\u003c\u002fb\u003e\u003cbr\u003e(biblical references treat dogs as unclean — flesh torn off in field cast to\u003cbr\u003edogs, etc.)","\u003cb\u003eeels\u003c\u002fb\u003e\u003cbr\u003e\u003ci\u003eAnimals\u003c\u002fi\u003e (high_confidence, conf=0.47)\u003cbr\u003e\u003cspan style='color:#aaa'\u003eTikopia (Oceania)\u003c\u002fspan\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePreceding event:\u003c\u002fb\u003e\u003cbr\u003ediscovery of maori eating eels; revelation challenges tikopia beliefs in the\u003cbr\u003elethality of eel consumption.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eSubsequent event:\u003c\u002fb\u003e\u003cbr\u003ethe informant insists with seriousness on the belief that eels are lethal to\u003cbr\u003eeat","\u003cb\u003eeels\u003c\u002fb\u00 ethey will be told to go bathe, after which the children leave and go bathe","\u003cb\u003eendogamy\u003c\u002fb\u003e\u003cbr\u003e\u003ci\u003eBodily wastes and poor hygiene\u003c\u002fi\u003e (high_confidence, conf=0.20)\u003cbr\u003e\u003cspan style='color:#aaa'\u003eGaro (Asia)\u003c\u002fspan\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePreceding event:\u003c\u002fb\u003e\u003cbr\u003ecouples in nearby villages defying moiety exogamy by marrying within the moiety\u003cbr\u003e\u003cbr\u003e\u003cb\u003eSubsequent event:\u003c\u002fb\u003e\u003cbr\u003ewithdraw of social support and protection","\u003cb\u003epre-nubile pregnancy\u003c\u002fb\u003e\u003cbr\u003e\u003ci\u003eBodily wastes and poor hygiene\u003c\u002fi\u003e (soft, conf=0.13)\u003cbr\u003e\u003cspan style='color:#aaa'\u003eAkan (Africa)\u003c\u002fspan\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePreceding event:\u003c\u002fb\u003e\u003cbr\u003ea girl becomes pregnant before having her first menstruation\u003cbr\u003e\u003cbr\u003e\u003cb\u003eSubsequent event:\u003c\u002fb\u003e\u003cbr\u003ethe girl, along with the child and its father, should be exiled","\u003cb\u003eeating excrement\u003c\u002fb\u003e\u003cbr\u003e\u003ci\u003eBodily wastes and poor hygiene\u003c\u002fi\u003e (high_confidence, conf=0.33)\u003cbr\u003e\u003cspan style='color:#aaa'\u003eTikopia (Oceania)\u003c\u002fspan\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePreceding event:\u003c\u002fb\u003e\u003cbr\u003ea person swears to eat excrement while praying to deities\u003cbr\u003e\u003cbr\u003e\u003cb\u003eSubsequent event:\u003c\u002fb\u003e\u003cbr\u003ethe kava reciter continues with the standard formula of self-abasement","\u003cb\u003estench and ulcers\u003c\u002fb\u003e\u003cbr\u003e\u003ci\u003eBodily wastes and poor hygiene\u003c\u002fi\u003e (high_confidence, conf=0.38)\u003cbr\u003e\u003cspan style='color:#aaa'\u003eIroquois (North America)\u003c\u002fspan\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePreceding ev
